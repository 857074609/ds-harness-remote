name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Validate version tag
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'

          const readJson = async (path) => JSON.parse(await readFile(path, 'utf8'))
          const root = await readJson('package.json')
          const plugin = await readJson('packages/plugin/package.json')
          const versions = new Set([root.version, plugin.version])
          const expectedTag = `v${plugin.version}`

          if (versions.size !== 1) {
            throw new Error(`Release versions do not match: ${[...versions].join(', ')}`)
          }
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Expected tag ${expectedTag}, received ${process.env.GITHUB_REF_NAME}`)
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: |
          pnpm --filter './packages/**' -r build
          pnpm -r check

      - name: Run tests
        run: pnpm -r test

      # Android prebuild recompiles shared packages. Serialize workspace builds
      # so Plugin bundling cannot read dist files while tsc rewrites them.
      - name: Build workspace
        run: NODE_ENV=production pnpm --workspace-concurrency=1 -r build

      - name: Pack npm plugin
        run: |
          mkdir -p release-assets
          pnpm --dir packages/plugin pack --pack-destination "$GITHUB_WORKSPACE/release-assets"

      - name: Stage release assets
        run: |
          cd release-assets
          sha256sum *.tgz > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          body_path: .github/release-notes.md
          generate_release_notes: false

  android-apk:
    name: Build and attach Android APK
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter './packages/**' -r build

      - name: Check out Intelligent UI renderer source
        uses: actions/checkout@v6
        with:
          repository: dreamfarer-space/deepseek-harness-intelligent-ui
          # Pinned upstream PR #24 merge commit; update only after auditing the new artifact.
          ref: bfb6b35f7ee94291629796d2b5eb577d20d8fa29
          path: .deps/deepseek-harness-intelligent-ui

      - name: Verify pinned Intelligent UI renderer
        run: |
          test "$(git -C .deps/deepseek-harness-intelligent-ui rev-parse HEAD)" = "bfb6b35f7ee94291629796d2b5eb577d20d8fa29" || { echo '::error::Unexpected renderer source commit'; exit 1; }
          test "$(git -C .deps/deepseek-harness-intelligent-ui hash-object renderer/renderer.js)" = "b8cb5e17bf7e77f3c9ed374edc0f994f358beeac" || { echo '::error::Unexpected renderer file content'; exit 1; }

      - name: Bundle local Android renderers
        env:
          DSH_INTELLIGENT_UI_RENDERER_BUNDLE: ${{ github.workspace }}/.deps/deepseek-harness-intelligent-ui/renderer/renderer.js
          DSH_REQUIRE_INTELLIGENT_UI: 'true'
        run: pnpm --dir apps/android run build:renderers

      - name: Verify bundled Android renderers
        env:
          DSH_REQUIRE_INTELLIGENT_UI: 'true'
        run: node apps/android/scripts/verify-intelligent-ui-renderer.mjs

      - name: Generate Android project
        run: pnpm --dir apps/android exec expo prebuild --platform android --no-install

      - name: Build release APK
        env:
          NODE_ENV: production
        run: |
          chmod +x apps/android/android/gradlew
          apps/android/android/gradlew \
            -p apps/android/android \
            :app:assembleRelease \
            --no-daemon \
            --build-cache \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Stage APK
        run: |
          mkdir -p artifacts/android
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk \
            "artifacts/android/dsh-remote-android-${{ github.ref_name }}.apk"

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/android/dsh-remote-android-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
